<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Object Detector</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=JetBrains+Mono&display=swap" rel="stylesheet" />
<!-- ONNX Runtime Web runs the YOLO model inside the browser -->
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
<style>
  :root { --bg:#05070d; --panel:rgba(16,24,40,.7); --neon:#22e5ff; --pink:#ff2bd6; --text:#d8f6ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:radial-gradient(circle at top,#0b1530,var(--bg)); color:var(--text); font-family:'JetBrains Mono',monospace; min-height:100vh; }
  header { text-align:center; padding:24px; }
  h1 { font-family:'Chakra Petch',sans-serif; font-size:2.4rem; letter-spacing:.2em; margin:0; color:var(--neon); text-shadow:0 0 18px var(--neon); }
  header p { opacity:.7; margin:6px 0 0; }
  main { display:grid; grid-template-columns:1fr 320px; gap:20px; max-width:1300px; margin:auto; padding:0 20px 30px; }
  @media (max-width:900px){ main { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid rgba(34,229,255,.3); border-radius:14px; padding:16px; box-shadow:0 0 24px rgba(34,229,255,.08); backdrop-filter:blur(8px); }
  .stage { position:relative; aspect-ratio:4/3; background:#000; border-radius:10px; overflow:hidden; }
  video, canvas#overlay { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .placeholder { position:absolute; inset:0; display:grid; place-items:center; opacity:.6; text-align:center; padding:20px; }
  .buttons { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
  button { font-family:'Chakra Petch',sans-serif; font-weight:700; letter-spacing:.1em; padding:10px 16px; border-radius:8px; border:1px solid var(--neon); background:transparent; color:var(--neon); cursor:pointer; transition:.2s; }
  button:hover:not(:disabled) { background:var(--neon); color:var(--bg); box-shadow:0 0 16px var(--neon); }
  button:disabled { opacity:.35; cursor:not-allowed; }
  button.alt { border-color:var(--pink); color:var(--pink); }
  button.alt:hover:not(:disabled) { background:var(--pink); color:var(--bg); box-shadow:0 0 16px var(--pink); }
  h2 { font-family:'Chakra Petch',sans-serif; font-size:.95rem; letter-spacing:.15em; color:var(--neon); margin:0 0 10px; }
  aside { display:flex; flex-direction:column; gap:16px; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stat { background:rgba(0,0,0,.3); border-radius:8px; padding:10px; }
  .stat b { display:block; font-size:1.4rem; color:var(--neon); }
  .stat span { font-size:.7rem; opacity:.7; }
  ul { list-style:none; margin:0; padding:0; max-height:200px; overflow:auto; font-size:.85rem; }
  li { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid rgba(255,255,255,.06); }
  .msg { margin-top:10px; color:var(--pink); font-size:.85rem; min-height:1em; }
</style>
</head>
<body>
<header>
  <h1>AI OBJECT DETECTOR</h1>
  <p>Real-time detection in your browser · your video never leaves your computer</p>
</header>

<main>
  <section class="panel">
    <div class="stage">
      <div class="placeholder" id="placeholder">Click START CAMERA to begin</div>
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>
    <div class="buttons">
      <button id="btnCamera">START CAMERA</button>
      <button id="btnDetect" disabled>START DETECTION</button>
      <button id="btnShot" class="alt" disabled>SCREENSHOT</button>
      <button id="btnClear" class="alt">CLEAR</button>
    </div>
    <div class="msg" id="msg"></div>
  </section>

  <aside>
    <div class="panel">
      <h2>STATISTICS</h2>
      <div class="stats">
        <div class="stat"><b id="sFps">0</b><span>FPS</span></div>
        <div class="stat"><b id="sCount">0</b><span>OBJECTS</span></div>
        <div class="stat"><b id="sConf">0%</b><span>AVG CONFIDENCE</span></div>
        <div class="stat"><b id="sStatus">IDLE</b><span>AI STATUS</span></div>
      </div>
    </div>
    <div class="panel"><h2>DETECTED OBJECTS</h2><ul id="list"><li>Nothing yet</li></ul></div>
    <div class="panel"><h2>AI ANALYSIS</h2><p id="analysis" style="margin:0;font-size:.85rem">Waiting for detection…</p></div>
    <div class="panel"><h2>HISTORY</h2><ul id="history"></ul></div>
  </aside>
</main>

<script>
// ---------- Settings ----------
const MODEL_URL = "./yolov8n.onnx";   // put yolov8n.onnx next to this file
const SIZE = 640;                      // YOLO input size
const MIN_SCORE = 0.45;                // ignore guesses below 45%
const IOU = 0.45;                      // overlap limit for merging boxes
const LABELS = [  "person","bicycle","car","motorcycle","airplane","bus","train","truck","boat","traffic light",  "fire hydrant","stop sign","parking meter","bench","bird","cat","dog","horse","sheep","cow",  "elephant","bear","zebra","giraffe","backpack","umbrella","handbag","tie","suitcase","frisbee",  "skis","snowboard","sports ball","kite","baseball bat","baseball glove","skateboard","surfboard",  "tennis racket","bottle","wine glass","cup","fork","knife","spoon","bowl","banana","apple",  "sandwich","orange","broccoli","carrot","hot dog","pizza","donut","cake","chair","couch",  "potted plant","bed","dining table","toilet","tv","laptop","mouse","remote","keyboard",  "cell phone","microwave","oven","toaster","sink","refrigerator","book","clock","vase",  "scissors","teddy bear","hair drier","toothbrush",];

// ---------- Page elements ----------
const $ = (id) => document.getElementById(id);
const video = $("video"), overlay = $("overlay"), ctx = overlay.getContext("2d");
let session = null, stream = null, detecting = false, lastTime = performance.now();
const lastSeen = {}; // for history: label -> time last seen

// ---------- Camera ----------
$("btnCamera").onclick = async () => {
  if (stream) { // stop camera
    stream.getTracks().forEach(t => t.stop()); stream = null; detecting = false;
    $("btnCamera").textContent = "START CAMERA"; $("btnDetect").disabled = true; $("btnShot").disabled = true;
    $("placeholder").style.display = "grid"; ctx.clearRect(0,0,overlay.width,overlay.height); setStatus("IDLE");
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
    video.srcObject = stream; await video.play();
    $("placeholder").style.display = "none"; $("btnCamera").textContent = "STOP CAMERA";
    $("btnDetect").disabled = false; $("btnShot").disabled = false; $("msg").textContent = "";
  } catch (e) {
    $("msg").textContent = "Camera blocked. Allow camera access in your browser's address bar and try again.";
  }
};

// ---------- Start/stop detection ----------
$("btnDetect").onclick = async () => {
  if (detecting) { detecting = false; $("btnDetect").textContent = "START DETECTION"; setStatus("PAUSED"); return; }
  if (!session) {
    setStatus("LOADING");
    try {
      ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/";
      session = await ort.InferenceSession.create(MODEL_URL, { executionProviders: ["wasm"] });
    } catch (e) {
      setStatus("ERROR"); $("msg").textContent = "Could not load the AI model. Make sure yolov8n.onnx is in the same folder as index.html."; return;
    }
  }
  detecting = true; $("btnDetect").textContent = "STOP DETECTION"; setStatus("ACTIVE"); loop();
};

function setStatus(s) { $("sStatus").textContent = s; }

// ---------- Detection loop ----------
async function loop() {
  if (!detecting) return;
  const boxes = await detect();
  draw(boxes); updatePanels(boxes);
  const now = performance.now(); $("sFps").textContent = Math.round(1000 / (now - lastTime)); lastTime = now;
  requestAnimationFrame(loop);
}

// Turn the video frame into a 640x640 tensor, run the model, and decode boxes
const prep = document.createElement("canvas"); prep.width = prep.height = SIZE;
const pctx = prep.getContext("2d", { willReadFrequently: true });
async function detect() {
  const vw = video.videoWidth, vh = video.videoHeight;
  const scale = Math.min(SIZE / vw, SIZE / vh), nw = vw * scale, nh = vh * scale;
  pctx.fillStyle = "#727272"; pctx.fillRect(0, 0, SIZE, SIZE);
  pctx.drawImage(video, 0, 0, nw, nh); // letterbox at top-left
  const px = pctx.getImageData(0, 0, SIZE, SIZE).data;
  const input = new Float32Array(3 * SIZE * SIZE), area = SIZE * SIZE;
  for (let i = 0; i < area; i++) {
    input[i] = px[i*4] / 255; input[i + area] = px[i*4+1] / 255; input[i + 2*area] = px[i*4+2] / 255;
  }
  const out = await session.run({ [session.inputNames[0]]: new ort.Tensor("float32", input, [1, 3, SIZE, SIZE]) });
  const data = out[session.outputNames[0]].data, N = 8400, found = [];
  for (let i = 0; i < N; i++) {
    let best = 0, cls = 0;
    for (let c = 0; c < 80; c++) { const s = data[(4 + c) * N + i]; if (s > best) { best = s; cls = c; } }
    if (best < MIN_SCORE) continue;
    const cx = data[i], cy = data[N + i], w = data[2*N + i], h = data[3*N + i];
    found.push({ label: LABELS[cls], score: best,
      x: (cx - w/2) / scale, y: (cy - h/2) / scale, w: w / scale, h: h / scale });
  }
  return nms(found);
}

// Remove duplicate boxes on the same object
function nms(boxes) {
  boxes.sort((a, b) => b.score - a.score);
  const keep = [];
  for (const b of boxes) if (!keep.some(k => k.label === b.label && iou(k, b) > IOU)) keep.push(b);
  return keep;
}
function iou(a, b) {
  const x1 = Math.max(a.x, b.x), y1 = Math.max(a.y, b.y);
  const x2 = Math.min(a.x + a.w, b.x + b.w), y2 = Math.min(a.y + a.h, b.y + b.h);
  const inter = Math.max(0, x2 - x1) * Math.max(0, y2 - y1);
  return inter / (a.w * a.h + b.w * b.h - inter);
}

// ---------- Drawing glowing boxes ----------
function draw(boxes) {
  overlay.width = video.videoWidth; overlay.height = video.videoHeight;
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  ctx.font = "bold 18px 'Chakra Petch'"; ctx.lineWidth = 3;
  for (const b of boxes) {
    ctx.strokeStyle = "#22e5ff"; ctx.shadowColor = "#22e5ff"; ctx.shadowBlur = 16;
    ctx.strokeRect(b.x, b.y, b.w, b.h); ctx.shadowBlur = 0;
    const text = b.label.toUpperCase() + " " + Math.round(b.score * 100) + "%";
    const tw = ctx.measureText(text).width + 12;
    ctx.fillStyle = "#22e5ff"; ctx.fillRect(b.x, Math.max(0, b.y - 26), tw, 26);
    ctx.fillStyle = "#05070d"; ctx.fillText(text, b.x + 6, Math.max(19, b.y - 7));
  }
}

// ---------- Side panels ----------
function updatePanels(boxes) {
  $("sCount").textContent = boxes.length;
  $("sConf").textContent = boxes.length ? Math.round(boxes.reduce((s, b) => s + b.score, 0) / boxes.length * 100) + "%" : "0%";
  const counts = {}; boxes.forEach(b => counts[b.label] = (counts[b.label] || 0) + 1);
  const names = Object.keys(counts);
  $("list").innerHTML = names.length ? names.map(n => "<li><span>" + n + "</span><span>×" + counts[n] + "</span></li>").join("") : "<li>Nothing detected</li>";
  $("analysis").textContent = names.length
    ? "I can see " + names.map(n => counts[n] + " " + n + (counts[n] > 1 ? "s" : "")).join(", ") + "."
    : "No known objects in view right now.";
  const now = Date.now();
  for (const n of names) {
    if (!lastSeen[n] || now - lastSeen[n] > 3000) {
      const li = document.createElement("li");
      li.innerHTML = "<span>" + n + "</span><span>" + new Date().toLocaleTimeString() + "</span>";
      $("history").prepend(li);
    }
    lastSeen[n] = now;
  }
}

// ---------- Screenshot & clear ----------
$("btnShot").onclick = () => {
  const c = document.createElement("canvas"); c.width = video.videoWidth; c.height = video.videoHeight;
  const g = c.getContext("2d"); g.drawImage(video, 0, 0); g.drawImage(overlay, 0, 0);
  const a = document.createElement("a"); a.href = c.toDataURL("image/png"); a.download = "detection.png"; a.click();
};
$("btnClear").onclick = () => {
  $("history").innerHTML = ""; $("list").innerHTML = "<li>Nothing yet</li>";
  $("analysis").textContent = "Waiting for detection…"; for (const k in lastSeen) delete lastSeen[k];
};
</script>
</body>
</html>
